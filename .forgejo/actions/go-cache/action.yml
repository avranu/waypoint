name: go-cache
description: Restore and save Go's module cache (shared across jobs, keyed on Go version and go.sum) and per-kind daily build cache (saved by the first passing job of each kind per day).
inputs:
  kind:
    description: what the job builds, e.g. backend-race, backend, lint, e2e
    required: true
  path:
    description: more directories to keep with Go's (lint's golangci-lint cache)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        gov=$(go env GOVERSION)
        sum=$(sha256sum go.sum | cut -c1-16)
        base="go-build-$KIND-$gov-$(go env GOOS)-$(go env GOARCH)"
        {
          echo "gocache=$(go env GOCACHE)"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "modkey=go-mod-$gov-$sum"
          echo "modprefix=go-mod-$gov-"
          echo "base=$base"
          echo "sum=$base-$sum"
          echo "day=$(date -u +%Y%m%d)"
        } >>"$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.gomodcache }}
        key: ${{ steps.key.outputs.modkey }}
        restore-keys: |
          ${{ steps.key.outputs.modprefix }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.key.outputs.gocache }}
          ${{ inputs.path }}
        key: ${{ steps.key.outputs.sum }}-${{ steps.key.outputs.day }}
        restore-keys: |
          ${{ steps.key.outputs.sum }}-
          ${{ steps.key.outputs.base }}-
