name: go-cache
description: Restore and save Go's module cache (shared across jobs, keyed on Go version and go.sum; isolated for release) and per-kind 4-hour build cache (refreshed every 4h UTC so heavy churn doesn't recompile from a stale midnight cache).
inputs:
  kind:
    description: what the job builds, e.g. backend-race, backend, lint, e2e
    required: true
  path:
    description: more directories to keep with Go's (lint's golangci-lint cache)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        gov=$(go env GOVERSION)
        sum=$(sha256sum go.sum | cut -c1-16)
        base="go-build-$KIND-$gov-$(go env GOOS)-$(go env GOARCH)"
        if [ "$KIND" = release ]; then
          modbase="go-mod-release-$gov"
        else
          modbase="go-mod-$gov"
        fi
        day=$(date -u +%Y%m%d)
        slot=$(( $(date -u +%-H) / 4 ))
        {
          echo "gocache=$(go env GOCACHE)"
          echo "gomodcache=$(go env GOMODCACHE)"
          echo "modkey=$modbase-$sum"
          echo "modprefix=$modbase-"
          echo "base=$base"
          echo "sum=$base-$sum"
          echo "day=$day"
          echo "slot=${day}-s${slot}"
        } >>"$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.gomodcache }}
        key: ${{ steps.key.outputs.modkey }}
        restore-keys: |
          ${{ steps.key.outputs.modprefix }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.key.outputs.gocache }}
          ${{ inputs.path }}
        key: ${{ steps.key.outputs.sum }}-${{ steps.key.outputs.slot }}
        restore-keys: |
          ${{ steps.key.outputs.sum }}-${{ steps.key.outputs.day }}-
          ${{ steps.key.outputs.sum }}-
          ${{ steps.key.outputs.base }}-
