# Local gate. Install once: `pip install pre-commit && pre-commit install`.
# Fast hooks run here; slow suites (go test -race, vuln DB, npm audit) stay in
# CI. Node-based hooks bootstrap their own runtime via nodeenv, so no system
# Node is required to commit.
#
# Tool versions are pinned (see additional_dependencies + Makefile TOOLS).
# Hook revs are commit SHAs (a tag can be moved; WP-844), so update them with
# `pre-commit autoupdate --freeze`; the additional_dependencies pins are
# covered by renovate.json regex managers.
# The commit hooks stay fast. The pre-push hooks run CI's lint job (make
# prepush) on the parts the push changes (WP-156), and dep-age on every push;
# skip once with `git push --no-verify`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict # case-insensitive filesystems (Windows/macOS)
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      # gofmt ships with Go, so this works with zero setup.
      - id: gofmt
        name: gofmt -w
        entry: gofmt -w
        language: system
        types: [go]
      # Full lint on changed files. Needs the binary: `make tools`.
      - id: golangci-lint
        name: golangci-lint run --fix
        entry: golangci-lint run --fix
        language: system
        types: [go]
        require_serial: true

  - repo: local
    hooks:
      - id: prepush-go
        name: CI lint, Go (make prepush-go)
        entry: make prepush-go
        language: system
        files: '(\.go|^go\.(mod|sum)|^\.golangci\.yml)$'
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      - id: prepush-ops
        name: CI lint, workflow and k8s (make prepush-ops)
        entry: make prepush-ops
        language: system
        files: '^(\.forgejo/|deploy/k8s/)'
        pass_filenames: false
        stages: [pre-push]
      - id: prepush-web
        name: CI lint, web (make prepush-web)
        entry: make prepush-web
        language: system
        files: '^web/'
        exclude: '^web/dist/'
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      # New dependency versions must be 7 days old (WP-844). It reads git,
      # not the files, so it runs on every push; with nothing new it asks no
      # registry. Compares the commit pushed (pre-commit's PRE_COMMIT_TO_REF,
      # the first ref of a push) with origin/main as last fetched.
      - id: dep-age
        name: new dependency versions are 7 days old (go run ./cmd/dep-age)
        entry: go run ./cmd/dep-age
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4 # frozen: v3.1.0, a wrapper rev; the prettier version comes from additional_dependencies
    hooks:
      - id: prettier
        files: '\.(ts|tsx|js|mjs|css|json|md)$'
        exclude: '^(web/dist/|.*package-lock\.json$)'
        additional_dependencies:
          - prettier@3.9.10

  # NOTE: no eslint hook (yet). typescript-eslint v8 hard-errors on this
  # repo's TypeScript 7, so linting can't run until upstream supports TS
  # >= 7.1 (see web/eslint.config.mjs + README Tooling). The day it lands:
  # re-add the mirrors-eslint block below with current pins.
  # - repo: https://github.com/pre-commit/mirrors-eslint
  #   rev: v9.9.1
  #   hooks:
  #     - id: eslint
  #       files: '^web/src/.+\.(ts|tsx|js|mjs)$'
  #       args: ['--fix', '-c', 'web/eslint.config.mjs']
  #       additional_dependencies:
  #         - eslint@10.12.0
  #         - '@eslint/js@10.0.1'
