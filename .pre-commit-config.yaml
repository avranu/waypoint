# Hook revs are commit SHAs, not tags, because a tag can be moved after it is pinned.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt -w
        entry: gofmt -w
        language: system
        types: [go]
      - id: golangci-lint
        name: golangci-lint run --fix
        entry: golangci-lint run --fix
        language: system
        types: [go]
        require_serial: true

  - repo: local
    hooks:
      - id: prepush-go
        name: CI lint, Go (make prepush-go)
        entry: make prepush-go
        language: system
        files: '(\.go|^go\.(mod|sum)|^\.golangci\.yml)$'
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      - id: prepush-ops
        name: CI lint, workflow and k8s (make prepush-ops)
        entry: make prepush-ops
        language: system
        files: '^(\.forgejo/|\.github/|deploy/k8s/)'
        pass_filenames: false
        stages: [pre-push]
      - id: prepush-web
        name: CI lint, web (make prepush-web)
        entry: make prepush-web
        language: system
        files: '^web/'
        exclude: '^web/dist/'
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
      # It compares the pushed commit with the local origin/main, as last fetched, so a stale fetch changes which versions count as new.
      - id: dep-age
        name: new dependency versions are 7 days old (go run ./cmd/dep-age)
        entry: go run ./cmd/dep-age
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: ffb6a759a979008c0e6dff86e39f4745a2d9eac4 # The rev is the mirrors wrapper, not prettier; the prettier version comes from additional_dependencies.
    hooks:
      - id: prettier
        files: '\.(ts|tsx|js|mjs|css|json|md)$'
        exclude: '^(web/dist/|.*package-lock\.json$)'
        additional_dependencies:
          - prettier@3.9.10

  # NOTE: no eslint hook (yet). typescript-eslint v8 hard-errors on this
  # repo's TypeScript 7, so linting can't run until upstream supports TS
  # >= 7.1 (see web/eslint.config.mjs + README Tooling). The day it lands:
  # re-add the mirrors-eslint block below with current pins.
