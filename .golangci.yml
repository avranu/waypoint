version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [git.jmann.me/claude/waypoint]

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*compress/gzip.Writer).Write
        - (*compress/gzip.Writer).Close
        - fmt.Fprintf
        - io.Copy
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
    paths:
      - web/node_modules

