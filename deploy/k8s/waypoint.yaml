apiVersion: v1
kind: Namespace
metadata:
  name: waypoint
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: waypoint
  namespace: waypoint
spec:
  serviceName: waypoint
  replicas: 1
  selector:
    matchLabels: { app: waypoint }
  template:
    metadata:
      labels: { app: waypoint }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: waypoint
          image: registry.example.com/waypoint:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: WAYPOINT_BASE_URL, value: "https://waypoint.example.com" }
            - { name: WAYPOINT_TRUST_PROXY, value: "1" }
            - name: WAYPOINT_METRICS_TOKEN
              valueFrom:
                secretKeyRef: { name: waypoint, key: metrics-token, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: waypoint
  namespace: waypoint
spec:
  selector: { app: waypoint }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waypoint
  namespace: waypoint
spec:
  rules:
    - host: waypoint.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: waypoint, port: { name: http } }
  tls:
    - hosts: [waypoint.example.com]
      secretName: waypoint-tls
